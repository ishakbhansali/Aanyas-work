</style>
<script>
(()=>{
  const button=document.getElementById('world-menu-toggle');
  const nav=document.getElementById('world-navigation');
  const header=button.closest('header');
  const mobile=window.matchMedia('(max-width: 850px)');
  header.classList.add('menu-enhanced');
  function closeMenu(){button.setAttribute('aria-expanded','false');button.textContent=window.AANYA_I18N?.ui.menu||'☰ Menu';nav.hidden=mobile.matches;}
  function sync(){button.hidden=!mobile.matches;closeMenu();}
  button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.textContent=open?(window.AANYA_I18N?.ui.closeMenu||'× Close'):(window.AANYA_I18N?.ui.menu||'☰ Menu');nav.hidden=!open;});
  nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{closeMenu();if(mobile.matches){const href=link.getAttribute('href');const target=href.startsWith('#')?document.querySelector(href):null;if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}}}));
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&button.getAttribute('aria-expanded')==='true'){closeMenu();button.focus();}});
  document.addEventListener('click',event=>{if(!header.contains(event.target))closeMenu();});
  if(mobile.addEventListener)mobile.addEventListener('change',sync);else mobile.addListener(sync);
  sync();
})();
</script>
